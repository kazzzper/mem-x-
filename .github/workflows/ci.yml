name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - name: Quality gate (fmt + vet + race tests + dep gate)
        run: make check
      - name: Full harness (coverage + benchmarks + fuzz)
        run: make harness
      - name: Dependency CVE scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: static builds (release matrix)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build release matrix + checksums
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: mem-x-binaries
          path: dist/
